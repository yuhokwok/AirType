<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirType</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f8;color:#777;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh}.portal{width:min(560px,calc(100vw - 32px));background:white;border:1px solid #ddd;border-radius:4px;box-shadow:0 5px 16px #0002;overflow:hidden}header{text-align:center;padding:16px;background:linear-gradient(110deg,#effffb,#edf9ff,#eee9ff,#fff1ff);font-size:19px;font-weight:300}form{display:flex;align-items:stretch;padding:16px;gap:12px}textarea{border:0;outline:0;resize:vertical;width:100%;min-height:96px;font:20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#444}button{border:0;background:transparent;color:#22bec5;font-size:17px;cursor:pointer;min-height:44px;padding:0 12px}button:disabled{opacity:.4;cursor:default}footer{border-top:1px solid #eee;padding:10px 16px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;margin-right:6px}.connected .dot{background:#82df37}.help{padding:0 16px 16px;font-size:12px;color:#999}#status{max-width:330px}button:focus-visible{outline:2px solid #22bec5;border-radius:3px}textarea:focus-visible{outline:1px solid #caf3f4}
</style></head><body><main class="portal"><header>AirType</header><form id="form"><textarea id="text" aria-label="Text to send to your iPhone or iPad" placeholder="Type here…" autofocus></textarea><button id="send" type="submit" disabled>Send</button></form><footer><span id="status" role="status"><i class="dot"></i>Switch to AirType on your iOS device.</span><div><button id="delete" aria-label="Delete one character on your device" disabled>Delete</button><button id="return" aria-label="Insert a new line on your device" disabled>↵</button></div></footer><div class="help">Enter to send · Shift + Enter for a new line. Keep AirType open on your device.</div></main>
<script>
let token=location.hash.slice(1);const text=document.querySelector('#text'), status=document.querySelector('#status');let connected=false,busy=false,polling=false;const buttons=[...document.querySelectorAll('button')];
function update(message,ok){connected=ok;status.className=ok?'connected':'';status.replaceChildren();let dot=document.createElement('i');dot.className='dot';status.append(dot,document.createTextNode(message));buttons.forEach(b=>b.disabled=!ok||busy)}
async function request(path,options={}){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3000);try{let response=await fetch(path,{...options,signal:controller.signal,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(!response.ok)throw Error(response.status===403?'Open the complete address shown on AirType.':'Connection lost');return response}finally{clearTimeout(timer)}}
async function poll(){if(polling||busy)return;polling=true;try{await request('/status');update('Connected. Ready to type.',true)}catch(e){update(token?'Reconnecting… Keep AirType open on your device.':'Open the complete address shown on AirType.',false)}finally{polling=false}}
async function send(action){if(!connected||busy)return;let value=text.value;if(action==='insert'&&!value)return;busy=true;buttons.forEach(b=>b.disabled=true);try{await request('/command',{method:'POST',body:JSON.stringify({id:crypto.randomUUID?crypto.randomUUID():uuid(),action,text:action==='insert'?value:null})});if(action==='insert'&&text.value===value)text.value='';update('Sent to your device.',true)}catch(e){update('Send not confirmed. Your draft is kept; check your device before resending.',false)}finally{busy=false;buttons.forEach(b=>b.disabled=!connected);text.focus()}}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{let r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==='x'?r:(r&3|8)).toString(16)})}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();send('insert')};text.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send('insert')}};document.querySelector('#delete').onclick=()=>send('delete');document.querySelector('#return').onclick=()=>send('newline');addEventListener('hashchange',()=>{token=location.hash.slice(1);poll()});poll();setInterval(poll,1500);
</script></body></html>

name: AirType
options:
  bundleIdPrefix: com.invivo
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  AirType:
    type: application
    platform: iOS
    sources:
      - AirTypeApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.AirTypeReplica
        INFOPLIST_FILE: AirTypeApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirTypeKeyboard
        embed: true
  AirTypeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - AirTypeKeyboard
      - path: Shared
        excludes: ['Assets.xcassets/AppIcon.appiconset']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.AirTypeReplica.Keyboard
        INFOPLIST_FILE: AirTypeKeyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AirTypeTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AirType
schemes:
  AirType:
    build:
      targets:
        AirType: all
    test:
      targets: [AirTypeTests]

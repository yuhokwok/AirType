name: AirType
options:
  bundleIdPrefix: com.invivo.ios
  developmentLanguage: en
  knownRegions: [en, zh-Hant, zh-Hans]
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5778F83X4J
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '3'
targets:
  AirType:
    type: application
    platform: iOS
    sources:
      - AirTypeApp
      - NativeShared
      - Shared
      - path: AirType.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.ios.AirType
        INFOPLIST_FILE: AirTypeApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AirTypeApp/AirType.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AirType
    dependencies:
      - target: AirTypeKeyboard
        embed: true
  AirTypeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - AirTypeKeyboard
      - NativeShared
      - path: Shared
        excludes: ['Assets.xcassets/AppIcon.appiconset']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.ios.AirType.Keyboard
        INFOPLIST_FILE: AirTypeKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: AirTypeKeyboard/AirType.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AirTypeDesktop:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - AirTypeMac
      - Shared/LocalNetworkFailure.swift
      - NativeShared
      - path: Shared/Assets.xcassets
        excludes: ['AppIcon.appiconset']
      - path: AirType.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invivo.mac.AirTypeDesktop
        INFOPLIST_FILE: AirTypeMac/Info.plist
        TARGETED_DEVICE_FAMILY: ''
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AirType
  AirTypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ['*.cjs']
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AirType
schemes:
  AirType:
    build:
      targets:
        AirType: all
    test:
      targets: [AirTypeTests]
  AirTypeDesktop:
    build:
      targets:
        AirTypeDesktop: all
